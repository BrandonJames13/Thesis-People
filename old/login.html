<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>TSU CCS — Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1c2333;
        --surface3: #21262d;
        --border: #30363d;
        --accent: #2f81f7;
        --accent2: #388bfd;
        --green: #3fb950;
        --red: #f85149;
        --orange: #d29922;
        --purple: #bc8cff;
        --text: #e6edf3;
        --text2: #8b949e;
        --text3: #6e7681;
        --mono: "Space Mono", monospace;
        --sans: "DM Sans", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* subtle grid background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(47, 129, 247, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(47, 129, 247, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }
      .brand-icon {
        width: 40px;
        height: 40px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .brand-text {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
        line-height: 1.3;
      }
      .brand-sub {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--text3);
        font-weight: 400;
        letter-spacing: 0;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }
      .subtitle {
        font-size: 13px;
        color: var(--text2);
        margin-bottom: 28px;
      }

      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
        margin-bottom: 6px;
        letter-spacing: 0.3px;
      }
      input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--text);
        font-size: 14px;
        font-family: var(--sans);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.15);
      }
      input::placeholder {
        color: var(--text3);
      }

      .error-msg {
        display: none;
        background: rgba(248, 81, 73, 0.1);
        border: 1px solid rgba(248, 81, 73, 0.3);
        color: var(--red);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
      }

      .btn-login {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: var(--sans);
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
        margin-top: 4px;
      }
      .btn-login:hover {
        background: var(--accent2);
        transform: translateY(-1px);
      }
      .btn-login:active {
        transform: translateY(0);
      }

      .demo-hint {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .demo-hint-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: var(--mono);
        margin-bottom: 10px;
      }
      .demo-accounts {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .demo-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .demo-row:hover {
        border-color: var(--accent);
        background: rgba(47, 129, 247, 0.05);
      }
      .demo-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .demo-user {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        font-family: var(--mono);
      }
      .demo-pass {
        font-size: 11px;
        color: var(--text3);
      }
      .demo-role {
        font-size: 10px;
        font-weight: 600;
        font-family: var(--mono);
        padding: 2px 8px;
        border-radius: 10px;
      }
      .demo-role.admin {
        background: rgba(47, 129, 247, 0.15);
        color: var(--accent2);
        border: 1px solid rgba(47, 129, 247, 0.25);
      }
      .demo-role.faculty {
        background: rgba(63, 185, 80, 0.12);
        color: var(--green);
        border: 1px solid rgba(63, 185, 80, 0.25);
      }

      .footer-note {
        margin-top: 24px;
        text-align: center;
        font-size: 11px;
        color: var(--text3);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">📅</div>
        <div>
          <div class="brand-text">TSU · CCS</div>
          <div class="brand-sub">Room Scheduling System</div>
        </div>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to access the scheduling dashboard</p>

      <div class="field">
        <label for="login-username">Username</label>
        <input
          id="login-username"
          type="text"
          placeholder="Enter your username"
          autocomplete="username"
        />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <div id="login-error" class="error-msg">
        ⚠ Incorrect username or password.
      </div>

      <button class="btn-login" onclick="doLogin()">Sign In →</button>

      <div class="demo-hint">
        <div class="demo-hint-title">Demo Accounts — click to fill</div>
        <div class="demo-accounts">
          <div class="demo-row" onclick="fillDemo('admin', 'admin123')">
            <div class="demo-info">
              <div class="demo-user">admin</div>
              <div class="demo-pass">admin123</div>
            </div>
            <span class="demo-role admin">ADMIN</span>
          </div>
          <div class="demo-row" onclick="fillDemo('reyes', 'reyes2025')">
            <div class="demo-info">
              <div class="demo-user">reyes</div>
              <div class="demo-pass">reyes2025</div>
            </div>
            <span class="demo-role faculty">FACULTY</span>
          </div>
          <div class="demo-row" onclick="fillDemo('garcia', 'garcia2025')">
            <div class="demo-info">
              <div class="demo-user">garcia</div>
              <div class="demo-pass">garcia2025</div>
            </div>
            <span class="demo-role faculty">FACULTY</span>
          </div>
          <div class="demo-row" onclick="fillDemo('santos', 'santos2025')">
            <div class="demo-info">
              <div class="demo-user">santos</div>
              <div class="demo-pass">santos2025</div>
            </div>
            <span class="demo-role faculty">FACULTY</span>
          </div>
        </div>
      </div>

      <p class="footer-note">AY 2025–2026 · 1st Semester · v1.0 BETA</p>
    </div>

    <script>
      // Redirect to dashboard if already logged in
      if (sessionStorage.getItem("rss_user")) {
        window.location.href = "index.html";
      }

      // Demo user database
      const USERS = {
        admin: {
          username: "admin",
          password: "admin123",
          name: "Admin User",
          initials: "AU",
          role: "admin",
        },
        faculty: {
          username: "faculty",
          password: "faculty123",
          name: "Faculty User",
          initials: "FU",
          role: "faculty",
        },
        reyes: {
          username: "reyes",
          password: "reyes2025",
          name: "Reyes, A.",
          initials: "RA",
          role: "faculty",
        },
        lim: {
          username: "lim",
          password: "lim2025",
          name: "Lim, K.",
          initials: "LK",
          role: "faculty",
        },
        santos: {
          username: "santos",
          password: "santos2025",
          name: "Santos, M.",
          initials: "SM",
          role: "faculty",
        },
        garcia: {
          username: "garcia",
          password: "garcia2025",
          name: "Garcia, L.",
          initials: "GL",
          role: "faculty",
        },
        cruz: {
          username: "cruz",
          password: "cruz2025",
          name: "Cruz, P.",
          initials: "CP",
          role: "faculty",
        },
      };

      function doLogin() {
        const username = document
          .getElementById("login-username")
          .value.trim()
          .toLowerCase();
        const password = document.getElementById("login-password").value;
        const errEl = document.getElementById("login-error");
        const user = USERS[username];

        if (!user || user.password !== password) {
          errEl.style.display = "block";
          document.getElementById("login-password").value = "";
          document.getElementById("login-password").focus();
          return;
        }

        errEl.style.display = "none";
        // Store user info (without password) in sessionStorage
        const { password: _, ...safeUser } = user;
        sessionStorage.setItem("rss_user", JSON.stringify(safeUser));
        window.location.href = "index.html";
      }

      function fillDemo(username, password) {
        document.getElementById("login-username").value = username;
        document.getElementById("login-password").value = password;
        document.getElementById("login-error").style.display = "none";
        document.getElementById("login-password").focus();
      }

      // Allow pressing Enter to submit
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });
    </script>
  </body>
</html>
